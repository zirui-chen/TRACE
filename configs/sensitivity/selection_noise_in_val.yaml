# ===========================================================================
# Sensitivity analysis: selection_noise_in_val  (arm: trace) -- Table 10, axis (g) selection = noise triples kept in Q_val (old protocol)
#
# Table 10, row: syn-val MRR .529   |   real-54 MRR .367
#
# Old protocol: generator-injected noise triples (nu) are kept in the
# validation query set Q_val used by the acceptance filter and model
# selection. Default: noise triples excluded from Q_val, .531 / .369.
#
# For every axis the DEFAULT (bold row in Table 10) is the synthetic-validation
# argmax: syn-val .531 / real-54 .369 (configs/trace.yaml). 3 seeds per
# configuration (default: 5); syn-val is the selection criterion, real-54 MRR
# was computed once after freezing (Appendix K).
#
# Scoring uses a common pool of 200 held-out synthetic KGs per configuration,
# merged across all configurations of the axis, so no configuration is favored
# by its own validation distribution (Appendix K).
# Generate with:
#   python scripts/generate_corpus.py --config configs/sensitivity/selection_noise_in_val.yaml
# ===========================================================================

arm: trace
corpus_dir: data/corpus/sensitivity/selection_noise_in_val
out_dir:    checkpoints/sensitivity/selection_noise_in_val

supervision: premise_faithful   # default TRACE task construction unless a
                                # split_ablation above overrides it

q_val_includes_noise: true

# Training (released ULTRA configuration, Appendix O; same for every arm)
n_steps:                 200000
batch_size:              64
lr:                      0.0005
n_negatives:             128
adversarial_temperature: 1.0
checkpoint_every:        10000
derived_frac:            0.5

generator:
  n_kg: 2000
  use_rules: true

# ULTRA reasoner, frozen (Appendix O: 6+6 GNN layers, hidden 64, 168,070 params)
rel_model:
  num_layers: 6
  hidden_dim: 64
entity_model:
  num_layers: 6
  hidden_dim: 64
