# ===========================================================================
# Sensitivity analysis: query_mix_30_70  (arm: trace) -- Table 10, axis (a) query mix, derived:non-derived = 30:70
#
# Table 10, row: syn-val MRR .519   |   real-54 MRR .359
#
# 30% derived + 70% non-derived queries per batch. Default 50:50
# (derived_frac: 0.5) = .531 / .369.
#
# For every axis the DEFAULT (bold row in Table 10) is the synthetic-validation
# argmax: syn-val .531 / real-54 .369 (configs/trace.yaml). 3 seeds per
# configuration (default: 5); syn-val is the selection criterion, real-54 MRR
# was computed once after freezing (Appendix K).
#
# Scoring uses a common pool of 200 held-out synthetic KGs per configuration,
# merged across all configurations of the axis, so no configuration is favored
# by its own validation distribution (Appendix K).
# Generate with:
#   python scripts/generate_corpus.py --config configs/sensitivity/query_mix_30_70.yaml
# ===========================================================================

arm: trace
corpus_dir: data/corpus/sensitivity/query_mix_30_70
out_dir:    checkpoints/sensitivity/query_mix_30_70

supervision: premise_faithful   # default TRACE task construction unless a
                                # split_ablation above overrides it


# Training (released ULTRA configuration, Appendix O; same for every arm)
n_steps:                 200000
batch_size:              64
lr:                      0.0005
n_negatives:             128
adversarial_temperature: 1.0
checkpoint_every:        10000
derived_frac:            0.3

generator:
  n_kg: 2000
  use_rules: true

# ULTRA reasoner, frozen (Appendix O: 6+6 GNN layers, hidden 64, 168,070 params)
rel_model:
  num_layers: 6
  hidden_dim: 64
entity_model:
  num_layers: 6
  hidden_dim: 64
