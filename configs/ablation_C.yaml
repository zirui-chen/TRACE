# ===========================================================================
# Ablation C (arm: ablation_c) -- RULES, FIXED statistics  (Table 3 cell C)
#
# Paper §4.2 / Table 3: mean MRR 0.338 +/- 0.005 over the 54 graphs
# (external-hard 0.174). A vs. C (+0.031, p < 0.001) isolates the
# statistical-diversity axis while rules stay on: collapsing the seven
# statistics axes to their prior medians costs three MRR points.
#
# All rule templates stay on; every drawn KG uses the FIXED statistics of
# the prior medians (trace/defaults.py FIXED_STATS; §4.2), so the corpus
# no longer spans the benchmark's statistics support (Fig. 3).
# Generate with:
#   python scripts/generate_corpus.py --config configs/ablation_C.yaml
# ===========================================================================

arm: ablation_c
corpus_dir: data/corpus/ablation_C
out_dir:    checkpoints/ablation_C

supervision: premise_faithful   # identical construction; only the generator varies

# Training (released ULTRA configuration, identical to every other arm)
n_steps:                 200000
batch_size:              64
lr:                      0.0005
n_negatives:             128
adversarial_temperature: 1.0
checkpoint_every:        10000
derived_frac:            0.5    # same 50/50 query mixing as A

generator:
  n_kg:      2000
  use_rules: true               # all seven templates T1-T7 stay active
  fixed_stats:                  # prior medians (trace/defaults.py FIXED_STATS)
    n_ent: 1732
    n_rel: 34
    kappa: 1.0
    gamma: 2.25
    mu:    12.2
    eta:   0.25
    nu:    0.05

# ULTRA reasoner, frozen (Appendix O)
rel_model:
  num_layers: 6
  hidden_dim: 64
entity_model:
  num_layers: 6
  hidden_dim: 64
